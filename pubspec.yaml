name: clipval
description: "ClipVal — private one-tap vault for storing values and copying to clipboard."
publish_to: "none"
version: 1.1.0+66

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Routing
  go_router: ^14.8.1

  # Local storage
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # Security
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  crypto: ^3.0.6
  pointycastle: ^3.9.1

  # Utils
  uuid: ^4.5.1
  intl: any
  cupertino_icons: ^1.0.8
  package_info_plus: ^9.0.1

  # Migration (CSV export share + import file pick)
  share_plus: ^10.1.4
  file_picker: ^8.3.7

  # Home Screen widget (iOS WidgetKit via App Group snapshot)
  home_widget: ^0.7.0

  # Loading skeletons (Triftly pattern; ^2.1.3+ for Flutter 3.32 CI)
  skeletonizer: ^2.1.3

  # App Store rating prompt (P1 activation loop)
  in_app_review: ^2.0.10

  # Nearby send (LocalSend-inspired LAN item transfer)
  bonsoir: ^5.1.11
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

# Generate iOS + Android launcher icons from master art:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app-icons/source/app-icon-1024.png
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app-icons/source/app-icon-1024.png

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900

  assets:
    - assets/fonts/
    - assets/icon/app-icons/source/
