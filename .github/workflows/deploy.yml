# ClipVal — TestFlight deploy (patterned after Triftly Deploy workflow).
# Push to main → build + upload. Manual run via Actions → Deploy.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'
      - 'PRD.md'
  workflow_dispatch:
    inputs:
      changelog_prefix:
        description: Optional line added at the top of TestFlight "What to Test" notes
        required: false
        type: string
      skip_testflight:
        description: Skip TestFlight build/upload (e.g. Apple daily upload limit)
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: TestFlight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_testflight != 'true'
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Prefer GH_PAT so fastlane can push the build-number bump commit.
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Select Xcode
        run: |
          # Prefer a recent stable Xcode on the runner image.
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d /Applications/Xcode_16.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d /Applications/Xcode_16.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          fi
          xcodebuild -version
          sw_vers

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: '2.5.23'
          bundler-cache: true
          working-directory: ios

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          env -u BUNDLE_GEMFILE -u BUNDLE_BIN_PATH -u BUNDLE_PATH \
            PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin" \
            pod install --repo-update

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_CONTENT" ]; then
            echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_CONTENT"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect
          # Secret may contain literal \n — expand to real newlines
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | sed 's/\\n/\n/g' > ~/.appstoreconnect/api_key.p8
          chmod 600 ~/.appstoreconnect/api_key.p8
          echo "✅ API key written ($(wc -c < ~/.appstoreconnect/api_key.p8) bytes)"

      - name: Verify iOS CI secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          missing=()
          for key in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID IOS_DISTRIBUTION_CERT_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            echo "Copy the same values from yky32/triftly-app (same Apple team 3G34999H3A)."
            echo "See docs/CI_TESTFLIGHT.md"
            exit 1
          fi
          echo "✅ iOS CI secrets present"

      - name: Prepare App Store signing
        env:
          CI: true
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          cd ios
          unset SPACESHIP_2FA_SMS_DEFAULT_PHONE_NUMBER FASTLANE_SESSION FASTLANE_PASSWORD FASTLANE_USER FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD || true
          bundle exec fastlane ios prune_excess_certificates_for_ci
          bundle exec fastlane ios setup_appstore_signing

      - name: Preview TestFlight release notes
        env:
          CHANGELOG_PREFIX: ${{ github.event.inputs.changelog_prefix }}
        run: |
          LAST_BUILD=$(git log -1 --pretty=format:%H --grep='Auto-increment build number' || true)
          {
            echo "## TestFlight — What's in this build"
            echo ""
            if [ -n "$LAST_BUILD" ]; then
              git log "${LAST_BUILD}..HEAD" --pretty=format:'- %s' --no-merges \
                | grep -v 'Auto-increment build number' \
                | grep -v '^chore: Auto-increment' || true
            else
              git log -15 --pretty=format:'- %s' --no-merges
            fi
            echo ""
            if [ -n "$CHANGELOG_PREFIX" ]; then
              echo "**Prefix:** $CHANGELOG_PREFIX"
            fi
          } | tee release-notes-preview.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure git for build bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to TestFlight
        env:
          CI: true
          TESTFLIGHT_CHANGELOG_PREFIX: ${{ github.event.inputs.changelog_prefix }}
          SIGH_NAME: ${{ env.SIGH_NAME }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          cd ios
          unset SPACESHIP_2FA_SMS_DEFAULT_PHONE_NUMBER FASTLANE_SESSION FASTLANE_PASSWORD FASTLANE_USER FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD || true
          bundle exec fastlane ios upload_testflight

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy failed!"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Secrets guide: docs/CI_TESTFLIGHT.md"
