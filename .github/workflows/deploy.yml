# ClipVal — TestFlight deploy (patterned after Triftly Deploy workflow).
# Push to main → build + upload. Manual run via Actions → Deploy.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - 'docs/**'
      - 'PRD.md'
  workflow_dispatch:
    inputs:
      changelog_prefix:
        description: Optional line added at the top of TestFlight "What to Test" notes
        required: false
        type: string
      skip_testflight:
        description: Skip TestFlight build/upload (e.g. Apple daily upload limit)
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: TestFlight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_testflight != 'true'
    # Apple requires iOS 26 SDK (Xcode 26+) for App Store / TestFlight uploads (2026).
    # Same runner family as Triftly Deploy.
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Prefer GH_PAT so fastlane can push the build-number bump commit.
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          set -e
          # Prefer explicit Xcode 26.x (iOS 26 SDK required by App Store Connect).
          for app in \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode_26.app \
            /Applications/Xcode.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              echo "Using $app"
              break
            fi
          done
          xcodebuild -version
          sw_vers
          # Fail early if SDK is too old for ASC
          SDK=$(xcodebuild -showsdks 2>/dev/null | awk '/iOS SDKs:/{f=1;next}/^$/{f=0}f && /iphoneos/{print; exit}')
          echo "iOS SDK: $SDK"


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler: '2.5.23'
          bundler-cache: true
          working-directory: ios

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
          env -u BUNDLE_GEMFILE -u BUNDLE_BIN_PATH -u BUNDLE_PATH \
            PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin" \
            pod install --repo-update

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_CONTENT" ]; then
            echo "::error::Missing secret APP_STORE_CONNECT_API_KEY_CONTENT"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect
          KEY_FILE="$HOME/.appstoreconnect/api_key.p8"
          # Prefer base64 (avoids GitHub secret newline mangling → OpenSSL "invalid curve name")
          if [ "$APP_STORE_CONNECT_API_KEY_IS_BASE64" = "true" ]; then
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$KEY_FILE"
          else
            # Literal PEM, or PEM with escaped \n
            printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | sed 's/\\n/\n/g' > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          # Sanity-check PEM structure without printing the key
          if ! head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::API key file does not look like a PEM private key"
            exit 1
          fi
          echo "✅ API key written ($(wc -c < "$KEY_FILE") bytes)"

      - name: Verify iOS CI secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          missing=()
          for key in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID IOS_DISTRIBUTION_CERT_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub secrets: ${missing[*]}"
            echo "Copy the same values from yky32/triftly-app (same Apple team 3G34999H3A)."
            echo "See docs/CI_TESTFLIGHT.md"
            exit 1
          fi
          echo "✅ iOS CI secrets present"

      - name: Prepare App Store signing
        env:
          CI: true
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
        run: |
          cd ios
          unset SPACESHIP_2FA_SMS_DEFAULT_PHONE_NUMBER FASTLANE_SESSION FASTLANE_PASSWORD FASTLANE_USER FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD || true
          # Prune is best-effort (must not block if Spaceship/OpenSSL quirks)
          bundle exec fastlane ios prune_excess_certificates_for_ci || echo "::warning::prune skipped"
          bundle exec fastlane ios setup_appstore_signing

      - name: Preview TestFlight release notes
        env:
          CHANGELOG_PREFIX: ${{ github.event.inputs.changelog_prefix }}
        run: |
          LAST_BUILD=$(git log -1 --pretty=format:%H --grep='Auto-increment build number' || true)
          {
            echo "## TestFlight — What's in this build"
            echo ""
            if [ -n "$LAST_BUILD" ]; then
              git log "${LAST_BUILD}..HEAD" --pretty=format:'- %s' --no-merges \
                | grep -v 'Auto-increment build number' \
                | grep -v '^chore: Auto-increment' || true
            else
              git log -15 --pretty=format:'- %s' --no-merges
            fi
            echo ""
            if [ -n "$CHANGELOG_PREFIX" ]; then
              echo "**Prefix:** $CHANGELOG_PREFIX"
            fi
          } | tee release-notes-preview.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure git for build bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to TestFlight
        env:
          CI: true
          # Full SHA baked into the IPA for Settings footer (v1.0.0 #abcdef1)
          GIT_COMMIT: ${{ github.sha }}
          TESTFLIGHT_CHANGELOG_PREFIX: ${{ github.event.inputs.changelog_prefix }}
          SIGH_NAME: ${{ env.SIGH_NAME }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          cd ios
          unset SPACESHIP_2FA_SMS_DEFAULT_PHONE_NUMBER FASTLANE_SESSION FASTLANE_PASSWORD FASTLANE_USER FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD || true
          bundle exec fastlane ios upload_testflight

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy failed!"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Secrets guide: docs/CI_TESTFLIGHT.md"
