# ClipVal — Android CI (debug APK + optional Play Internal AAB)
# Fastlane lanes: android build_debug | build_release_bundle | upload_internal

name: Deploy Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "ios/fastlane/Fastfile"
      - ".github/workflows/deploy-android.yml"
  workflow_dispatch:
    inputs:
      upload_play:
        description: "Upload release AAB to Play Internal Testing (needs secrets + Play app)"
        required: false
        type: boolean
        default: false
      skip_debug:
        description: "Skip debug APK job"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-android
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  debug-apk:
    name: Debug APK
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_debug != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipval-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  play-internal:
    name: Play Internal (AAB)
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.upload_play == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler: "2.5.23"
          bundler-cache: true
          working-directory: ios

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/clipval-upload.jks
          chmod 600 android/clipval-upload.jks

      - name: Git identity (version bump commits)
        run: |
          git config user.email "ci@clipval.app"
          git config user.name "ClipVal CI"

      - name: Fastlane upload_internal
        working-directory: ios
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/clipval-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
          PLAY_STORE_JSON_KEY_IS_BASE64: "true"
          CI: "true"
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle exec fastlane android upload_internal

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipval-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
