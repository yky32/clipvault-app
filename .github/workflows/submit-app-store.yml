# Submit an existing TestFlight build for App Store review (no rebuild).
name: Submit App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.1.0)
        required: true
        default: "1.1.0"
        type: string
      build:
        description: Optional CFBundle build number (e.g. 65). Empty = newest VALID.
        required: false
        default: "65"
        type: string

concurrency:
  group: submit-app-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    name: Submit for Review
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect"
          KEY_FILE="$HOME/.appstoreconnect/api_key.p8"
          if [ -z "${APP_STORE_CONNECT_API_KEY_CONTENT:-}" ]; then
            echo "::error::Missing APP_STORE_CONNECT_API_KEY_CONTENT"
            exit 1
          fi
          if [ "${APP_STORE_CONNECT_API_KEY_IS_BASE64:-}" = "true" ]; then
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$KEY_FILE"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | sed 's/\\n/\n/g' > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

      - name: Submit App Store version
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SUBMIT_VERSION: ${{ github.event.inputs.version }}
          SUBMIT_BUILD: ${{ github.event.inputs.build }}
        run: |
          set -euo pipefail
          bundle exec fastlane ios submit_app_store \
            version:"$SUBMIT_VERSION" \
            build:"$SUBMIT_BUILD"
