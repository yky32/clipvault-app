name: Mirror secrets → Replicaz
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Remirror ASC key as clean base64
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
        run: |
          set -euo pipefail
          TARGET=yky32/replicaz-app
          KEY=/tmp/api_key.p8
          FLAG="$(printf '%s' "${APP_STORE_CONNECT_API_KEY_IS_BASE64:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ "$FLAG" = "true" ] || [ "$FLAG" = "1" ]; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | tr -d '\n\r ' | base64 --decode > "$KEY"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | sed 's/\\n/\n/g' > "$KEY"
          fi
          head -1 "$KEY" | grep -q "BEGIN PRIVATE KEY"
          echo "pem lines=$(wc -l < "$KEY") bytes=$(wc -c < "$KEY")"
          # Store ONLY base64 single line + flag true
          B64=$(base64 -w0 "$KEY")
          printf '%s' "$B64" | gh secret set APP_STORE_CONNECT_API_KEY_CONTENT -R "$TARGET" --body -
          printf 'true' | gh secret set APP_STORE_CONNECT_API_KEY_IS_BASE64 -R "$TARGET" --body -
          printf '%s' "$APP_STORE_CONNECT_API_KEY_ID" | tr -d '\n\r ' | gh secret set APP_STORE_CONNECT_API_KEY_ID -R "$TARGET" --body -
          printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '\n\r ' | gh secret set APP_STORE_CONNECT_ISSUER_ID -R "$TARGET" --body -
          rm -f "$KEY"
          echo done
