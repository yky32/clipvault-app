# One-shot: mirror Apple/TF secrets from this repo → yky32/replicaz-app
# Same ASC team 3G34999H3A. Delete after success.
name: Mirror secrets → Replicaz

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror secrets to yky32/replicaz-app
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          GH_PAT_VALUE: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT missing on clipvault-app"
            exit 1
          fi
          TARGET=yky32/replicaz-app
          set_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "skip $name (empty)"
              return 0
            fi
            printf '%s' "$value" | gh secret set "$name" -R "$TARGET" --body -
            echo "set $name"
          }
          set_secret APP_STORE_CONNECT_API_KEY_ID "$APP_STORE_CONNECT_API_KEY_ID"
          set_secret APP_STORE_CONNECT_ISSUER_ID "$APP_STORE_CONNECT_ISSUER_ID"
          set_secret APP_STORE_CONNECT_API_KEY_CONTENT "$APP_STORE_CONNECT_API_KEY_CONTENT"
          set_secret APP_STORE_CONNECT_API_KEY_IS_BASE64 "${APP_STORE_CONNECT_API_KEY_IS_BASE64:-true}"
          set_secret IOS_DISTRIBUTION_CERT_BASE64 "$IOS_DISTRIBUTION_CERT_BASE64"
          set_secret IOS_DISTRIBUTION_CERT_PASSWORD "$IOS_DISTRIBUTION_CERT_PASSWORD"
          set_secret FASTLANE_USER "$FASTLANE_USER"
          set_secret FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD "$FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD"
          set_secret GH_PAT "$GH_PAT_VALUE"
          echo "✅ mirrored to $TARGET"
          gh secret list -R "$TARGET"
