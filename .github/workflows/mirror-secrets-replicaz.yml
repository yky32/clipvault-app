name: Mirror secrets → Replicaz
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Write ASC key with length verify
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          TARGET=yky32/replicaz-app
          echo "source content_len=${#APP_STORE_CONNECT_API_KEY_CONTENT}"
          KEY=/tmp/api_key.p8
          FLAG="$(printf '%s' "${APP_STORE_CONNECT_API_KEY_IS_BASE64:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ "$FLAG" = "true" ] || [ "$FLAG" = "1" ]; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | tr -d '\n\r ' | base64 -d > "$KEY"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | sed 's/\\n/\n/g' > "$KEY"
          fi
          head -1 "$KEY" | grep -q "BEGIN PRIVATE KEY"
          base64 -w0 "$KEY" > /tmp/key.b64
          echo "b64_len=$(wc -c < /tmp/key.b64)"
          # Use --body-file equivalent via stdin without --body -
          gh secret set APP_STORE_CONNECT_API_KEY_CONTENT --repo "$TARGET" < /tmp/key.b64
          echo -n true | gh secret set APP_STORE_CONNECT_API_KEY_IS_BASE64 --repo "$TARGET"
          echo -n "$APP_STORE_CONNECT_API_KEY_ID" | tr -d '\n\r ' | gh secret set APP_STORE_CONNECT_API_KEY_ID --repo "$TARGET"
          echo -n "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '\n\r ' | gh secret set APP_STORE_CONNECT_ISSUER_ID --repo "$TARGET"
          # certs
          echo -n "$IOS_DISTRIBUTION_CERT_BASE64" > /tmp/cert.b64
          echo -n "$IOS_DISTRIBUTION_CERT_PASSWORD" > /tmp/cert.pass
          gh secret set IOS_DISTRIBUTION_CERT_BASE64 --repo "$TARGET" < /tmp/cert.b64
          gh secret set IOS_DISTRIBUTION_CERT_PASSWORD --repo "$TARGET" < /tmp/cert.pass
          rm -f "$KEY" /tmp/key.b64 /tmp/cert.b64 /tmp/cert.pass
          gh secret list -R "$TARGET"
