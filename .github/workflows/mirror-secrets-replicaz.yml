# One-shot remirror: write ASC key as PEM (IS_BASE64=false) to avoid decode issues.
name: Mirror secrets → Replicaz

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror (PEM-normalized API key)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
          GH_PAT_VALUE: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          TARGET=yky32/replicaz-app
          KEY_FILE=/tmp/api_key.p8
          FLAG="$(printf '%s' "${APP_STORE_CONNECT_API_KEY_IS_BASE64:-}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ "$FLAG" = "true" ] || [ "$FLAG" = "1" ]; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$KEY_FILE"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | sed 's/\\n/\n/g' > "$KEY_FILE"
          fi
          if ! head -1 "$KEY_FILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::Could not normalize API key to PEM on source runner"
            exit 1
          fi
          echo "PEM ok ($(wc -c < "$KEY_FILE") bytes)"
          # Store as PEM; deploy will use non-base64 path
          gh secret set APP_STORE_CONNECT_API_KEY_CONTENT -R "$TARGET" < "$KEY_FILE"
          printf 'false' | gh secret set APP_STORE_CONNECT_API_KEY_IS_BASE64 -R "$TARGET" --body -
          printf '%s' "$APP_STORE_CONNECT_API_KEY_ID" | gh secret set APP_STORE_CONNECT_API_KEY_ID -R "$TARGET" --body -
          printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | gh secret set APP_STORE_CONNECT_ISSUER_ID -R "$TARGET" --body -
          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" | gh secret set IOS_DISTRIBUTION_CERT_BASE64 -R "$TARGET" --body -
          printf '%s' "$IOS_DISTRIBUTION_CERT_PASSWORD" | gh secret set IOS_DISTRIBUTION_CERT_PASSWORD -R "$TARGET" --body -
          printf '%s' "$FASTLANE_USER" | gh secret set FASTLANE_USER -R "$TARGET" --body -
          printf '%s' "$FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD" | gh secret set FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD -R "$TARGET" --body -
          printf '%s' "$GH_PAT_VALUE" | gh secret set GH_PAT -R "$TARGET" --body -
          rm -f "$KEY_FILE"
          gh secret list -R "$TARGET"
          echo "✅ remirror done (API key as PEM, IS_BASE64=false)"
