name: Mirror secrets → Replicaz
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Remirror distribution cert (validated)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          TARGET=yky32/replicaz-app
          P12=/tmp/dist.p12
          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" | tr -d '\n\r ' | base64 --decode > "$P12"
          # Validate PKCS12 opens with password
          openssl pkcs12 -in "$P12" -nokeys -passin pass:"$IOS_DISTRIBUTION_CERT_PASSWORD" >/tmp/p12_info.txt 2>&1 || {
            echo "::error::Source p12 invalid or wrong password"
            cat /tmp/p12_info.txt
            exit 1
          }
          echo "p12 ok ($(wc -c < "$P12") bytes)"
          # Clean single-line base64 back into secret
          base64 -w0 "$P12" | gh secret set IOS_DISTRIBUTION_CERT_BASE64 -R "$TARGET" --body -
          printf '%s' "$IOS_DISTRIBUTION_CERT_PASSWORD" | gh secret set IOS_DISTRIBUTION_CERT_PASSWORD -R "$TARGET" --body -
          rm -f "$P12"
          echo "✅ dist cert remirrored"
