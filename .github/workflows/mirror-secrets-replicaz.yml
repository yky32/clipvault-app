name: Mirror secrets → Replicaz
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Passthrough dist cert secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          TARGET=yky32/replicaz-app
          # Write via files to avoid shell mangling
          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" > /tmp/cert.b64
          printf '%s' "$IOS_DISTRIBUTION_CERT_PASSWORD" > /tmp/cert.pass
          echo "b64_len=$(wc -c < /tmp/cert.b64) pass_len=$(wc -c < /tmp/cert.pass)"
          gh secret set IOS_DISTRIBUTION_CERT_BASE64 -R "$TARGET" < /tmp/cert.b64
          gh secret set IOS_DISTRIBUTION_CERT_PASSWORD -R "$TARGET" < /tmp/cert.pass
          rm -f /tmp/cert.b64 /tmp/cert.pass
          echo done
